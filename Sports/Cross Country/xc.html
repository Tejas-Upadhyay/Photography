<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concert Photography Gallery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #f5f5f5;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
      padding: 2rem 0;
      text-align: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
      font-weight: 300;
    }

    /* Gallery Container */
    .gallery-container {
      max-width: 1400px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    /* Masonry Grid */
    .masonry-grid {
      display: grid;
      grid-gap: 1.5rem;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      grid-auto-rows: 10px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    /* Item Sizing */
    .gallery-item--small {
      grid-row-end: span 26;
    }

    .gallery-item--medium {
      grid-row-end: span 33;
    }

    .gallery-item--large {
      grid-row-end: span 45;
    }

    /* Fullscreen Overlay */
    .fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .fullscreen-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .fullscreen-image {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: 30px;
      right: 30px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.5);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .close-btn:hover {
      transform: scale(1.1);
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: white;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.5);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease;
      z-index: 101;
    }

    .prev-btn {
      left: 30px;
    }

    .next-btn {
      right: 30px;
    }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.1);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      background: #1a1a1a;
      margin-top: 3rem;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .social-links a {
      color: #f5f5f5;
      font-size: 1.5rem;
      transition: color 0.3s ease;
    }

    .social-links a:hover {
      color: #ff8a00;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .masonry-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }

      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .close-btn, .nav-btn {
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .masonry-grid {
        grid-template-columns: 1fr;
      }

      .fullscreen-image {
        max-width: 95%;
        max-height: 80%;
      }
    }
  </style>
</head>

<body>
<header>
  <h1>Concert Moments</h1>
  <p class="subtitle">Capturing the energy of live performances</p>
</header>

<div class="gallery-container">
  <div class="masonry-grid">
    <!-- Portrait images (taller) use --large class -->
    <!-- Landscape images (wider) use --medium or --small class -->
    <div class="gallery-item gallery-item--medium" data-fullsize="IMG_8283.JPG">
      <img src="IMG_8283.JPG" alt="Concert photo 1">
    </div>
  </div>
</div>

<!-- Fullscreen Viewer -->
<div class="fullscreen-overlay">
  <div class="close-btn"><i class="fas fa-times"></i></div>
  <div class="prev-btn"><i class="fas fa-chevron-left"></i></div>
  <div class="next-btn"><i class="fas fa-chevron-right"></i></div>
  <img class="fullscreen-image" src="" alt="Fullscreen concert photo">
</div>

<footer>
  <p>&copy; 2023 Concert Photography</p>
  <div class="social-links">
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-500px"></i></a>
    <a href="#"><i class="fab fa-flickr"></i></a>
  </div>
</footer>

<script>
  // Fullscreen viewer functionality
  document.addEventListener('DOMContentLoaded', function() {
    const galleryItems = document.querySelectorAll('.gallery-item');
    const overlay = document.querySelector('.fullscreen-overlay');
    const fullscreenImage = document.querySelector('.fullscreen-image');
    const closeBtn = document.querySelector('.close-btn');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');

    let currentIndex = 0;
    const images = Array.from(galleryItems).map(item => item.dataset.fullsize);

    // Open fullscreen viewer
    galleryItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        currentIndex = index;
        fullscreenImage.src = images[currentIndex];
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    // Close fullscreen viewer
    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      document.body.style.overflow = 'auto';
    });

    // Click on overlay to close
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.remove('active');
        document.body.style.overflow = 'auto';
      }
    });

    // Navigation between images
    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      fullscreenImage.src = images[currentIndex];
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % images.length;
      fullscreenImage.src = images[currentIndex];
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (!overlay.classList.contains('active')) return;

      if (e.key === 'Escape') {
        overlay.classList.remove('active');
        document.body.style.overflow = 'auto';
      } else if (e.key === 'ArrowLeft') {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        fullscreenImage.src = images[currentIndex];
      } else if (e.key === 'ArrowRight') {
        currentIndex = (currentIndex + 1) % images.length;
        fullscreenImage.src = images[currentIndex];
      }
    });

    // Masonry layout adjustment
    const resizeAllGridItems = () => {
      const gridItems = document.querySelectorAll('.gallery-item');
      gridItems.forEach(item => {
        const rowHeight = parseInt(window.getComputedStyle(document.querySelector('.masonry-grid')).getPropertyValue('grid-auto-rows'));
        const rowGap = parseInt(window.getComputedStyle(document.querySelector('.masonry-grid')).getPropertyValue('grid-row-gap'));
        const rowSpan = Math.ceil((item.querySelector('img').getBoundingClientRect().height + rowGap) / (rowHeight + rowGap));
        item.style.gridRowEnd = "span " + rowSpan;
      });
    }

    const imagesLoaded = () => {
      return new Promise((resolve) => {
        let loaded = 0;
        const images = document.querySelectorAll('.gallery-item img');

        if (images.length === 0) resolve();

        images.forEach(img => {
          if (img.complete) {
            loaded++;
          } else {
            img.addEventListener('load', () => {
              loaded++;
              if (loaded === images.length) resolve();
            });
          }
        });

        if (loaded === images.length) resolve();
      });
    }

    imagesLoaded().then(resizeAllGridItems);
    window.addEventListener('resize', resizeAllGridItems);
  });
</script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive Photography Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== BASE STYLES ===== */
        :root {
            --primary: #ff4d4d;
            --secondary: #ff8a00;
            --dark: #121212;
            --darker: #0a0a0a;
            --light: #f5f5f5;
            --gray: #333;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            font-weight: 300;
        }

        /* ===== GALLERY CONTAINER ===== */
        .gallery-container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        /* ===== MASONRY GRID ===== */
        .masonry-grid {
            display: grid;
            grid-gap: 1.5rem;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 10px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* ===== ITEM SIZING ===== */
        .gallery-item--small {
            grid-row-end: span 26;
        }

        .gallery-item--medium {
            grid-row-end: span 33;
        }

        .gallery-item--large {
            grid-row-end: span 45;
        }

        /* ===== FULLSCREEN OVERLAY ===== */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .fullscreen-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .close-btn:hover {
            transform: scale(1.1);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            z-index: 101;
        }

        .prev-btn {
            left: 30px;
        }

        .next-btn {
            right: 30px;
        }

        .nav-btn:hover {
            transform: translateY(-50%) scale(1.1);
        }

        /* ===== FILTER BUTTONS ===== */
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 20px;
            color: var(--light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 2rem;
            background: #1a1a1a;
            margin-top: 3rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .social-links a {
            color: #f5f5f5;
            font-size: 1.5rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: #ff8a00;
        }

        /* ===== LOADING INDICATOR ===== */
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }

        /* ===== RESPONSIVE ADJUSTMENTS ===== */
        @media (max-width: 768px) {
            .masonry-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .close-btn, .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .masonry-grid {
                grid-template-columns: 1fr;
            }

            .fullscreen-image {
                max-width: 95%;
                max-height: 80%;
            }

            .filter-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    // Function to determine image size class based on index
    function getSizeClass(index) {
        const sizes = ['small', 'medium', 'large'];
        return sizes[index % 3];
    }

    // Function to create gallery items
    function createGalleryItems() {
        const galleryGrid = document.getElementById('gallery-grid');
        const loadingIndicator = document.querySelector('.loading');

        loadingIndicator.style.display = 'block';
        galleryGrid.innerHTML = '';

        // Create image elements
        carImages.forEach((image, index) => {
            const sizeClass = getSizeClass(index);
            const item = document.createElement('div');
            item.className = `gallery-item gallery-item--${sizeClass}`;
            item.dataset.category = image.category;
            item.dataset.fullsize = image.filename;

            const img = document.createElement('img');
            img.src = image.filename;
            img.alt = `Car photo ${index + 1}`;
            img.loading = "lazy"; // Enable lazy loading

            item.appendChild(img);
            galleryGrid.appendChild(item);
        });

        loadingIndicator.style.display = 'none';
        initGallery();
    }

    // Initialize gallery functionality
    function initGallery() {
        const galleryItems = document.querySelectorAll('.gallery-item');
        const overlay = document.querySelector('.fullscreen-overlay');
        const fullscreenImage = document.querySelector('.fullscreen-image');
        const closeBtn = document.querySelector('.close-btn');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const filterButtons = document.querySelectorAll('.filter-btn');

        let currentIndex = 0;
        let filteredItems = Array.from(galleryItems);
        const allImages = Array.from(galleryItems).map(item => ({
            element: item,
            src: item.dataset.fullsize,
            category: item.dataset.category
        }));

        // Open fullscreen viewer
        galleryItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                currentIndex = index;
                fullscreenImage.src = allImages[currentIndex].src;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                updateFilteredItems();
            });
        });

        // Close fullscreen viewer
        closeBtn.addEventListener('click', () => {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        });

        // Click on overlay to close
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        });

        // Navigation between images
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + filteredItems.length) % filteredItems.length;
            fullscreenImage.src = filteredItems[currentIndex].src;
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % filteredItems.length;
            fullscreenImage.src = filteredItems[currentIndex].src;
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;

            if (e.key === 'Escape') {
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
            } else if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + filteredItems.length) % filteredItems.length;
                fullscreenImage.src = filteredItems[currentIndex].src;
            } else if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % filteredItems.length;
                fullscreenImage.src = filteredItems[currentIndex].src;
            }
        });

        // Filter functionality
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Update active button
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const filterValue = button.dataset.filter;
                filterImages(filterValue);
            });
        });

        function filterImages(filterValue) {
            if (filterValue === 'all') {
                galleryItems.forEach(item => {
                    item.style.display = 'block';
                });
                filteredItems = [...allImages];
            } else {
                galleryItems.forEach(item => {
                    if (item.dataset.category === filterValue) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
                filteredItems = allImages.filter(item => item.category === filterValue);
            }
            // Reset masonry layout
            resizeAllGridItems();
        }

        function updateFilteredItems() {
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            if (activeFilter === 'all') {
                filteredItems = [...allImages];
            } else {
                filteredItems = allImages.filter(item => item.category === activeFilter);
            }
            // Find the current image in the filtered set
            currentIndex = filteredItems.findIndex(item =>
                item.src === fullscreenImage.src
            );
        }

        // Masonry layout adjustment
        const resizeAllGridItems = () => {
            const gridItems = document.querySelectorAll('.gallery-item');
            const galleryGrid = document.getElementById('gallery-grid');

            gridItems.forEach(item => {
                if (item.style.display !== 'none') {
                    const rowHeight = parseInt(window.getComputedStyle(galleryGrid).getPropertyValue('grid-auto-rows'));
                    const rowGap = parseInt(window.getComputedStyle(galleryGrid).getPropertyValue('grid-row-gap'));
                    const rowSpan = Math.ceil((item.querySelector('img').getBoundingClientRect().height + rowGap) / (rowHeight + rowGap));
                    item.style.gridRowEnd = "span " + rowSpan;
                }
            });
        }

        // Initialize
        window.addEventListener('load', () => {
            resizeAllGridItems();
            // Check if images are already loaded
            const images = document.querySelectorAll('.gallery-item img');
            let loadedCount = 0;

            images.forEach(img => {
                if (img.complete) {
                    loadedCount++;
                } else {
                    img.addEventListener('load', () => {
                        loadedCount++;
                        if (loadedCount === images.length) {
                            resizeAllGridItems();
                        }
                    });
                }
            });

            if (loadedCount === images.length) {
                resizeAllGridItems();
            }
        });

        window.addEventListener('resize', resizeAllGridItems);
    }

    // Initialize the gallery when the page loads
    document.addEventListener('DOMContentLoaded', createGalleryItems);
</script>

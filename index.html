<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatic Narratives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Chromatic Narratives</h1>
        <nav>
            <a href="#gallery">Gallery</a>
        </nav>
    </header>

    <section class="hero">
        <h2 class="fade">Framing Stories Through Light</h2>
        <p class="fade">Automotive. Action. Atmosphere. Every frame tells a story.</p>
        <div class="hero-scroll fade">
            <span>Scroll</span>
            <div class="scroll-line"></div>
        </div>
    </section>

    <section class="grid" id="gallery">
        <a href="cars.html">
            <div class="card fade">
                <img src="Images/cars/cars_01.jpg" alt="Automotive" loading="lazy">
                <div class="card-title">Automotive</div>
            </div>
        </a>

        <a href="sports.html">
            <div class="card fade">
                <img src="Images/sports/sports_01.jpg" alt="Sports" loading="lazy">
                <div class="card-title">Sports</div>
            </div>
        </a>

        <a href="concerts.html">
            <div class="card fade">
                <img src="Images/concerts/concerts_01.jpg" alt="Concerts" loading="lazy">
                <div class="card-title">Concerts</div>
            </div>
        </a>

        <a href="film.html">
            <div class="card fade">
                <img src="Images/film/film_01.jpg" alt="Short Film" loading="lazy">
                <div class="card-title">Short Film</div>
            </div>
        </a>
    </section>

    <footer>
        &copy; 2026 Chromatic Narratives
    </footer>

    <script src="script.js"></script>
</body>

</html>
